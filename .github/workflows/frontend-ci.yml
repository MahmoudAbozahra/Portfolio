name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "portfolio-fronend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "portfolio-fronend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-fronend/package-lock.json
      - run: npm ci
        working-directory: portfolio-fronend
      - run: npm run build
        working-directory: portfolio-fronend
